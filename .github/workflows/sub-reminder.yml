name: Subscription Deadline Reminder

on:
  # schedule 已禁用：本地 launchd 09:40 BJ 更可靠，GH Actions 有随机延迟且会与本地抢 webhook 触发 rate limit
  # schedule:
  #   - cron: '40 1 * * *'
  workflow_dispatch:

jobs:
  remind:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Send reminder if any stock closes today
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
        run: python scripts/send_reminder.py
